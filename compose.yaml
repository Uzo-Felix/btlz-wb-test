version: '3.8'

# name: wb-tariff-service

networks:
  app-network:
    driver: bridge

volumes:
  postgres-vol:
    driver: local
  pgadmin-vol:
    driver: local
  app-logs:
    driver: local

services:
  postgres:
    container_name: wb-postgres
    image: postgres:16.1-alpine
    environment:
      - PGPORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb_user} -d ${POSTGRES_DB:-wb_tariffs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    container_name: wb-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@wbtariffs.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin-vol:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wb-tariff-service:
    container_name: wb-tariff-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-wb_tariffs}
      POSTGRES_USER: ${POSTGRES_USER:-wb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_secure_password}
      
      # Application Configuration
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
      
      # WB API Configuration
      WB_API_KEY: ${WB_API_KEY}
      WB_API_BASE_URL: ${WB_API_BASE_URL:-https://common-api.wildberries.ru/api/v1}
      
      # Google Sheets Configuration
      GOOGLE_CREDENTIALS_PATH: ./config/google-credentials.json
      GOOGLE_SPREADSHEET_IDS: ${GOOGLE_SPREADSHEET_IDS}
      
      # Scheduler Configuration
      FETCH_INTERVAL_HOURS: ${FETCH_INTERVAL_HOURS:-1}
      SHEETS_UPDATE_INTERVAL_HOURS: ${SHEETS_UPDATE_INTERVAL_HOURS:-6}
    volumes:
      - app-logs:/app/logs
      - ./config:/app/config:ro
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
